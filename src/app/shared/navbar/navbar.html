<nav
  aria-label="Navegação principal"
  class="fixed start-0 top-0 z-20 w-full border-b border-gray-200 bg-white shadow-xs"
>
  <div class="mx-auto flex max-w-screen-xl flex-wrap items-center justify-between p-4">
    <a routerLink="/" class="flex items-center space-x-3">
      <img src="assets/icon.png" alt="OrderFlow" class="h-8 w-auto" />
    </a>

    <div class="order-2 flex items-center space-x-3 md:order-2">
      @if (!isManager) {
        <a
          routerLink="/cart"
          class="relative inline-flex items-center rounded-lg bg-gray-100 p-2 text-gray-700 hover:bg-gray-200 focus:outline-none focus:ring-4 focus:ring-gray-300"
          [attr.aria-label]="'Carrinho, ' + cartItemCount + ' itens'"
        >
          <svg
            class="h-5 w-5"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 4h1.5L9 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-8.5-3h9.25L19 7H7.312"
            />
          </svg>
          <span class="sr-only">Carrinho</span>

          @if (cartItemCount > 0) {
            <span
              aria-hidden="true"
              class="absolute -right-1 -top-1 inline-flex h-5 w-5 items-center justify-center rounded-full border-2 border-white bg-red-500 text-xs font-bold text-white"
            >
              {{ cartItemCount }}
            </span>
          }
        </a>
      }

      <button
        type="button"
        aria-label="Sair da conta"
        class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-4 focus:ring-red-300"
        (click)="logout()"
      >
        Sair
      </button>

      <button
        type="button"
        class="inline-flex h-9 w-9 items-center justify-center rounded-lg p-2 text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 md:hidden"
        [attr.aria-expanded]="menuOpen"
        aria-controls="navbar-cta"
        [attr.aria-label]="menuOpen ? 'Fechar menu' : 'Abrir menu'"
        (click)="menuOpen = !menuOpen"
      >
        <svg
          class="h-6 w-6"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="2"
            d="M5 7h14M5 12h14M5 17h14"
          />
        </svg>
      </button>
    </div>

    <div
      id="navbar-cta"
      class="order-3 w-full items-center justify-between md:order-1 md:flex md:w-auto"
      [class.hidden]="!menuOpen"
    >
      <ul
        class="mt-4 flex flex-col rounded-lg border border-gray-100 bg-gray-50 p-4 font-medium md:mt-0 md:flex-row md:space-x-8 md:border-0 md:bg-white md:p-0"
      >
        @if (isManager) {
          <li>
            <a
              routerLink="/kanban"
              routerLinkActive="bg-blue-600 text-white md:bg-transparent md:text-blue-600"
              ariaCurrentWhenActive="page"
              class="block rounded px-3 py-2 text-gray-700 hover:bg-gray-100 md:p-0 md:hover:bg-transparent md:hover:text-blue-600"
            >
              Painel Kanban
            </a>
          </li>
          <li>
            <a
              routerLink="/stock"
              routerLinkActive="bg-blue-600 text-white md:bg-transparent md:text-blue-600"
              ariaCurrentWhenActive="page"
              class="block rounded px-3 py-2 text-gray-700 hover:bg-gray-100 md:p-0 md:hover:bg-transparent md:hover:text-blue-600"
            >
              Estoque
            </a>
          </li>
        } @else {
          <li>
            <a
              routerLink="/products"
              routerLinkActive="bg-blue-600 text-white md:bg-transparent md:text-blue-600"
              ariaCurrentWhenActive="page"
              class="block rounded px-3 py-2 text-gray-700 hover:bg-gray-100 md:p-0 md:hover:bg-transparent md:hover:text-blue-600"
            >
              Produtos
            </a>
          </li>
          <li>
            <a
              routerLink="/history"
              routerLinkActive="bg-blue-600 text-white md:bg-transparent md:text-blue-600"
              ariaCurrentWhenActive="page"
              class="block rounded px-3 py-2 text-gray-700 hover:bg-gray-100 md:p-0 md:hover:bg-transparent md:hover:text-blue-600"
            >
              Histórico
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
